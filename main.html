<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waruni Portfolio - Navigation</title>

  <!-- Google Fonts: Kanit & Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Prompt', 'Kanit', sans-serif;
    }

    /* =========================
       พื้นหลัง Witchy Purple
    ========================= */

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 18% 18%,
          rgba(211, 180, 239, 0.28),
          transparent 25%
        ),
        radial-gradient(
          circle at 82% 20%,
          rgba(163, 120, 181, 0.25),
          transparent 28%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(201, 165, 225, 0.22),
          transparent 32%
        ),
        linear-gradient(
          135deg,
          #2d2038 0%,
          #453050 32%,
          #60426d 65%,
          #806094 100%
        );

      color: #ffffff;
      padding: 40px 20px;

      position: relative;
      overflow-x: hidden;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* =========================
       แสงม่วงฟุ้ง ๆ
    ========================= */

    .glow-bg-1,
    .glow-bg-2,
    .glow-bg-3 {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .glow-bg-1 {
      width: 430px;
      height: 430px;

      top: -150px;
      right: -100px;

      background: rgba(193, 150, 218, 0.28);

      filter: blur(85px);

      animation: witchyGlow 8s ease-in-out infinite;
    }

    .glow-bg-2 {
      width: 390px;
      height: 390px;

      bottom: -150px;
      left: -100px;

      background: rgba(172, 128, 198, 0.25);

      filter: blur(90px);

      animation: witchyGlow 10s ease-in-out infinite reverse;
    }

    .glow-bg-3 {
      width: 300px;
      height: 300px;

      top: 40%;
      left: 42%;

      background: rgba(238, 218, 248, 0.08);

      filter: blur(90px);
    }

    /* =========================
       ดาวเล็ก ๆ
    ========================= */

    body::before {
      content: "✦  ˚  ✧  ⋆  ✦  ˚  ✧  ⋆  ✦";

      position: fixed;

      top: 7%;
      left: 5%;

      color: rgba(246, 229, 255, 0.55);

      font-size: 1rem;
      letter-spacing: 15px;

      white-space: nowrap;

      pointer-events: none;

      z-index: 1;

      animation: sparkle 5s ease-in-out infinite;
    }

    body::after {
      content: "✧  ⋆  ☾  ⋆  ✦  ˚  ✧";

      position: fixed;

      bottom: 8%;
      right: 5%;

      color: rgba(239, 215, 252, 0.50);

      font-size: 1.1rem;
      letter-spacing: 12px;

      white-space: nowrap;

      pointer-events: none;

      z-index: 1;

      animation: sparkle 6s ease-in-out infinite reverse;
    }

    /* =========================
       พระจันทร์ตกแต่ง
    ========================= */

    .moon {
      position: fixed;

      width: 95px;
      height: 95px;

      top: 9%;
      right: 8%;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 35%,
          #f8eaff,
          #d8b9e9 55%,
          #a77abd 100%
        );

      box-shadow:
        0 0 25px rgba(222, 188, 239, 0.35),
        0 0 60px rgba(177, 125, 202, 0.18);

      opacity: 0.75;

      z-index: 1;

      animation: moonFloat 7s ease-in-out infinite;
    }

    .moon::after {
      content: "";

      position: absolute;

      width: 95px;
      height: 95px;

      border-radius: 50%;

      background: #3d2a49;

      top: -13px;
      left: 23px;

      opacity: 0.95;
    }

    /* =========================
       ดาวตกแต่งเล็ก ๆ
    ========================= */

    .star {
      position: fixed;

      color: rgba(244, 225, 255, 0.75);

      z-index: 2;

      pointer-events: none;

      text-shadow:
        0 0 10px rgba(232, 200, 247, 0.7);

      animation: twinkle 3s ease-in-out infinite;
    }

    .star-1 {
      top: 23%;
      left: 13%;
      font-size: 1.2rem;
    }

    .star-2 {
      top: 72%;
      left: 8%;
      font-size: 0.8rem;
      animation-delay: 1s;
    }

    .star-3 {
      bottom: 22%;
      right: 17%;
      font-size: 1rem;
      animation-delay: 1.8s;
    }

    .star-4 {
      top: 48%;
      right: 7%;
      font-size: 0.7rem;
      animation-delay: 2.5s;
    }

    /* =========================
       Container
    ========================= */

    .container {
      max-width: 900px;
      width: 100%;

      position: relative;

      z-index: 10;
    }

    /* =========================
       Header
    ========================= */

    .top-bar {
      display: flex;

      justify-content: center;
      align-items: center;

      margin-bottom: 25px;
    }

    .header-title {
      font-size: 1.5rem;

      font-weight: 700;

      letter-spacing: 1.5px;

      color: #fff8ff;

      text-shadow:
        0 0 15px rgba(215, 178, 233, 0.45),
        0 3px 12px rgba(28, 17, 35, 0.45);

      position: relative;
    }

    .header-title::before {
      content: "☾";

      position: absolute;

      left: -38px;
      top: -3px;

      font-size: 1.4rem;

      color: #e5c8f3;

      text-shadow:
        0 0 12px rgba(220, 181, 239, 0.8);
    }

    .header-title::after {
      content: "";

      display: block;

      width: 70px;
      height: 2px;

      margin: 8px auto 0;

      border-radius: 20px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #d9b5ea,
          #ffffff,
          #d9b5ea,
          transparent
        );

      box-shadow:
        0 0 12px rgba(222, 190, 239, 0.55);
    }

    /* =========================
       Main Card
    ========================= */

    .menu-card {
      position: relative;

      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.13),
          rgba(170, 126, 191, 0.12)
        );

      border: 1px solid rgba(238, 216, 248, 0.30);

      border-radius: 32px;

      padding: 45px 30px;

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      box-shadow:
        0 25px 65px rgba(24, 14, 31, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.20),
        0 0 35px rgba(150, 101, 178, 0.08);

      text-align: center;

      animation: fadeInUp 0.9s ease-out;
    }

    /* เส้นเวทมนตร์ด้านบน */

    .menu-card::before {
      content: "";

      position: absolute;

      top: 0;
      left: 15%;

      width: 70%;
      height: 2px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(233, 205, 247, 0.85),
          transparent
        );

      box-shadow:
        0 0 15px rgba(216, 175, 235, 0.65);

      border-radius: 50%;
    }

    /* ลายแสงกลางการ์ด */

    .menu-card::after {
      content: "✦";

      position: absolute;

      top: 15px;
      right: 25px;

      font-size: 1.2rem;

      color: rgba(237, 211, 248, 0.5);

      text-shadow:
        0 0 12px rgba(228, 192, 242, 0.8);
    }

    .menu-title {
      position: relative;

      z-index: 2;

      font-size: 1.6rem;

      font-weight: 600;

      color: #fffaff;

      margin-bottom: 30px;

      text-shadow:
        0 2px 12px rgba(31, 18, 39, 0.45);
    }

    /* =========================
       Navigation Grid
    ========================= */

    .nav-grid {
      display: grid;

      grid-template-columns: repeat(3, 1fr);

      gap: 17px;
    }

    .nav-btn {
      position: relative;

      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.10),
          rgba(151, 105, 177, 0.12)
        );

      border: 1px solid rgba(239, 218, 248, 0.23);

      padding: 21px 12px;

      border-radius: 21px;

      color: #ffffff;

      text-decoration: none;

      font-size: 0.95rem;

      font-weight: 600;

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      transition:
        transform 0.35s ease,
        background 0.35s ease,
        box-shadow 0.35s ease,
        border-color 0.35s ease;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 9px;

      min-height: 108px;

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.10);
    }

    /* แสงเวทมนตร์วิ่งผ่านปุ่ม */

    .nav-btn::before {
      content: "";

      position: absolute;

      width: 75px;
      height: 180%;

      top: -40%;
      left: -110px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(236, 211, 247, 0.28),
          transparent
        );

      transform: rotate(20deg);

      transition: left 0.6s ease;

      pointer-events: none;
    }

    .nav-btn::after {
      content: "✦";

      position: absolute;

      top: 7px;
      right: 10px;

      font-size: 0.65rem;

      color: rgba(239, 216, 249, 0.35);

      transition: all 0.3s ease;
    }

    .nav-btn .icon {
      font-size: 1.55rem;

      transition:
        transform 0.35s ease,
        filter 0.35s ease;

      position: relative;

      z-index: 2;
    }

    .nav-btn:hover {
      background:
        linear-gradient(
          145deg,
          rgba(184, 142, 207, 0.38),
          rgba(124, 83, 151, 0.30)
        );

      border-color: rgba(242, 221, 251, 0.60);

      transform:
        translateY(-6px)
        scale(1.025);

      box-shadow:
        0 14px 30px rgba(35, 20, 44, 0.28),
        0 0 20px rgba(188, 139, 211, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.20);
    }

    .nav-btn:hover::before {
      left: 125%;
    }

    .nav-btn:hover::after {
      color: #f2d9ff;

      transform:
        scale(1.4)
        rotate(25deg);
    }

    .nav-btn:hover .icon {
      transform:
        translateY(-4px)
        scale(1.15)
        rotate(-4deg);

      filter:
        drop-shadow(
          0 0 8px rgba(236, 203, 249, 0.65)
        );
    }

    /* =========================
       Back Button
    ========================= */

    .bottom-bar {
      margin-top: 35px;

      display: flex;

      justify-content: center;
    }

    .btn-back {
      position: relative;

      overflow: hidden;

      display: inline-flex;

      align-items: center;

      gap: 10px;

      padding: 14px 38px;

      background:
        linear-gradient(
          135deg,
          rgba(159, 112, 181, 0.75),
          rgba(119, 79, 142, 0.75)
        );

      border: 1.5px solid rgba(245, 228, 251, 0.70);

      border-radius: 50px;

      color: #ffffff;

      text-decoration: none;

      font-size: 1rem;

      font-weight: 600;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      transition: all 0.35s ease;

      box-shadow:
        0 9px 25px rgba(28, 17, 35, 0.30),
        0 0 15px rgba(174, 125, 199, 0.15);
    }

    .btn-back::before {
      content: "";

      position: absolute;

      width: 80px;
      height: 160%;

      top: -30%;
      left: -110px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.30),
          transparent
        );

      transform: rotate(20deg);

      transition: left 0.6s ease;
    }

    .btn-back span {
      position: relative;

      z-index: 2;
    }

    .btn-back:hover {
      background:
        linear-gradient(
          135deg,
          #f3e3fa,
          #d8b9e9
        );

      color: #563964;

      border-color: #ffffff;

      transform:
        translateY(-4px)
        scale(1.03);

      box-shadow:
        0 13px 30px rgba(30, 17, 38, 0.30),
        0 0 22px rgba(218, 183, 236, 0.30);
    }

    .btn-back:hover::before {
      left: 125%;
    }

    /* =========================
       Animation
    ========================= */

    @keyframes fadeInUp {
      from {
        opacity: 0;

        transform:
          translateY(30px)
          scale(0.98);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }

    @keyframes witchyGlow {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(18px, -12px) scale(1.05);
      }
    }

    @keyframes sparkle {
      0%, 100% {
        opacity: 0.35;
        transform: translateY(0);
      }

      50% {
        opacity: 0.8;
        transform: translateY(-5px);
      }
    }

    @keyframes moonFloat {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.25;
        transform: scale(0.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.25);
      }
    }

    /* =========================
       Responsive
    ========================= */

    @media (max-width: 768px) {

      body {
        padding: 30px 16px;
      }

      .nav-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .menu-card {
        padding: 38px 22px;
      }

      .moon {
        width: 70px;
        height: 70px;

        right: 5%;
        top: 7%;
      }

      .moon::after {
        width: 70px;
        height: 70px;

        left: 17px;
        top: -9px;
      }
    }

    @media (max-width: 500px) {

      .header-title {
        font-size: 1.3rem;
      }

      .menu-title {
        font-size: 1.35rem;
      }

      .nav-grid {
        grid-template-columns: 1fr;
      }

      .menu-card {
        padding: 32px 18px;

        border-radius: 27px;
      }

      .nav-btn {
        min-height: 92px;
      }

      .moon {
        opacity: 0.45;
      }

      body::before,
      body::after {
        font-size: 0.7rem;
        letter-spacing: 7px;
      }
    }
  </style>
</head>

<body>

  <!-- แสงเรืองด้านหลัง -->
  <div class="glow-bg-1"></div>
  <div class="glow-bg-2"></div>
  <div class="glow-bg-3"></div>

  <!-- พระจันทร์ -->
  <div class="moon"></div>

  <!-- ดาวตกแต่ง -->
  <div class="star star-1">✦</div>
  <div class="star star-2">✧</div>
  <div class="star star-3">✦</div>
  <div class="star star-4">⋆</div>

  <div class="container">

    <!-- แถบด้านบน -->
    <div class="top-bar">
      <div class="header-title">About Name🪻</div>
    </div>

    <!-- การ์ดรวมปุ่มกดเมนู -->
    <div class="menu-card">

      <h2 class="menu-title">
        เลือกหน้าหัวข้อที่ต้องการเข้าดู 🩻🔭
      </h2>

      <div class="nav-grid">

        <a href="intro.html" class="nav-btn">
          <span class="icon">📝</span> คำนำ
        </a>

        <a href="profile.html" class="nav-btn">
          <span class="icon">👤</span> ประวัติส่วนตัว
        </a>

        <a href="education.html" class="nav-btn">
          <span class="icon">🎓</span> ประวัติการศึกษา
        </a>

        <a href="activities.html" class="nav-btn">
          <span class="icon">👋🏻</span> กิจกรรม
        </a>

        <a href="passion.html" class="nav-btn">
          <span class="icon">💡</span> ความสนใจในการศึกษาต่อ
        </a>

        <a href="target.html" class="nav-btn">
          <span class="icon">🏛️</span> คณะ สาขาและมหาลัยที่สนใจ
        </a>

        <a href="skills.html" class="nav-btn">
          <span class="icon">🧸</span> ทักษะ
        </a>

      </div>
    </div>

    <!-- ปุ่มย้อนกลับด้านล่าง -->
    <div class="bottom-bar">
      <a href="index.html" class="btn-back">
        <span>⬅</span> back
      </a>
    </div>

  </div>

</body>
</html>
