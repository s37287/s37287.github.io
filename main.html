<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waruni Portfolio - Navigation</title>

  <!-- Google Fonts: Kanit & Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Prompt', 'Kanit', sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 20%, rgba(205, 174, 218, 0.35), transparent 28%),
        radial-gradient(circle at 85% 15%, rgba(175, 143, 194, 0.30), transparent 25%),
        radial-gradient(circle at 75% 85%, rgba(225, 207, 232, 0.25), transparent 30%),
        linear-gradient(135deg, #62506d 0%, #7d6488 45%, #92789d 75%, #a58bad 100%);

      color: #ffffff;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* =========================
       พื้นหลังตกแต่ง
    ========================= */

    .glow-bg-1,
    .glow-bg-2,
    .glow-bg-3 {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .glow-bg-1 {
      width: 420px;
      height: 420px;
      top: -120px;
      right: -100px;
      background: rgba(220, 198, 227, 0.25);
      filter: blur(70px);
    }

    .glow-bg-2 {
      width: 380px;
      height: 380px;
      bottom: -140px;
      left: -100px;
      background: rgba(211, 188, 220, 0.22);
      filter: blur(75px);
    }

    .glow-bg-3 {
      width: 260px;
      height: 260px;
      top: 45%;
      left: 45%;
      background: rgba(255, 255, 255, 0.08);
      filter: blur(80px);
    }

    /* ฟองสบู่ด้านหลัง */
    .bubble {
      position: fixed;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      pointer-events: none;
      z-index: 1;
      animation: floatBubble 8s ease-in-out infinite;
    }

    .bubble::after {
      content: "";
      position: absolute;
      width: 28%;
      height: 28%;
      top: 15%;
      left: 18%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.30);
      filter: blur(2px);
    }

    .bubble-1 {
      width: 75px;
      height: 75px;
      top: 10%;
      left: 7%;
      animation-delay: 0s;
    }

    .bubble-2 {
      width: 38px;
      height: 38px;
      top: 25%;
      right: 8%;
      animation-delay: 1.5s;
    }

    .bubble-3 {
      width: 105px;
      height: 105px;
      bottom: 12%;
      right: 5%;
      animation-delay: 3s;
    }

    .bubble-4 {
      width: 48px;
      height: 48px;
      bottom: 20%;
      left: 10%;
      animation-delay: 2s;
    }

    .bubble-5 {
      width: 25px;
      height: 25px;
      top: 55%;
      left: 4%;
      animation-delay: 4s;
    }

    @keyframes floatBubble {
      0%, 100% {
        transform: translateY(0) translateX(0);
      }

      50% {
        transform: translateY(-18px) translateX(8px);
      }
    }

    /* =========================
       Container
    ========================= */

    .container {
      max-width: 900px;
      width: 100%;
      position: relative;
      z-index: 10;
    }

    /* =========================
       Header
    ========================= */

    .top-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 25px;
    }

    .header-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 1.5px;

      color: #ffffff;

      text-shadow:
        0 2px 12px rgba(65, 45, 75, 0.35);

      position: relative;
    }

    .header-title::after {
      content: "";
      display: block;
      width: 55px;
      height: 3px;
      margin: 7px auto 0;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.65);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.35);
    }

    /* =========================
       Main Glass Card
    ========================= */

    .menu-card {
      position: relative;
      overflow: hidden;

      background: rgba(255, 255, 255, 0.13);
      border: 1px solid rgba(255, 255, 255, 0.30);

      border-radius: 30px;
      padding: 42px 30px;

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      box-shadow:
        0 20px 55px rgba(70, 51, 78, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.20);

      text-align: center;

      animation: fadeInUp 0.8s ease-out;
    }

    /* แสงด้านบนของการ์ด */
    .menu-card::before {
      content: "";
      position: absolute;
      width: 260px;
      height: 100px;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);

      background: rgba(255, 255, 255, 0.15);
      filter: blur(35px);
      border-radius: 50%;

      pointer-events: none;
    }

    .menu-title {
      position: relative;
      z-index: 2;

      font-size: 1.6rem;
      font-weight: 600;
      color: #ffffff;

      margin-bottom: 30px;

      text-shadow:
        0 2px 10px rgba(65, 45, 75, 0.30);
    }

    /* =========================
       Navigation Grid
    ========================= */

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .nav-btn {
      position: relative;
      overflow: hidden;

      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.24);

      padding: 20px 12px;
      border-radius: 20px;

      color: #ffffff;
      text-decoration: none;

      font-size: 0.95rem;
      font-weight: 600;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      transition:
        transform 0.3s ease,
        background 0.3s ease,
        box-shadow 0.3s ease,
        border-color 0.3s ease;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;

      min-height: 105px;

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.10);
    }

    /* แสงวิ่งบนปุ่ม */
    .nav-btn::before {
      content: "";
      position: absolute;
      width: 80px;
      height: 180%;
      top: -40%;
      left: -100px;

      background: rgba(255, 255, 255, 0.12);

      transform: rotate(20deg);
      transition: left 0.5s ease;

      pointer-events: none;
    }

    .nav-btn .icon {
      font-size: 1.5rem;
      transition: transform 0.3s ease;
      position: relative;
      z-index: 2;
    }

    .nav-btn {
      position: relative;
      z-index: 2;
    }

    .nav-btn:hover {
      background: rgba(190, 157, 202, 0.55);
      border-color: rgba(255, 255, 255, 0.60);

      transform: translateY(-5px) scale(1.02);

      box-shadow:
        0 12px 28px rgba(79, 57, 88, 0.22),
        0 0 18px rgba(218, 194, 226, 0.20);
    }

    .nav-btn:hover::before {
      left: 120%;
    }

    .nav-btn:hover .icon {
      transform: translateY(-3px) scale(1.12) rotate(-3deg);
    }

    /* =========================
       Back Button
    ========================= */

    .bottom-bar {
      margin-top: 35px;
      display: flex;
      justify-content: center;
    }

    .btn-back {
      position: relative;
      overflow: hidden;

      display: inline-flex;
      align-items: center;
      gap: 10px;

      padding: 14px 36px;

      background: rgba(174, 143, 187, 0.70);
      border: 1.5px solid rgba(255, 255, 255, 0.70);

      border-radius: 50px;

      color: #ffffff;
      text-decoration: none;

      font-size: 1rem;
      font-weight: 600;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      transition: all 0.3s ease;

      box-shadow:
        0 8px 22px rgba(70, 50, 78, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    .btn-back::before {
      content: "";
      position: absolute;
      width: 80px;
      height: 150%;
      top: -25%;
      left: -110px;

      background: rgba(255, 255, 255, 0.18);

      transform: rotate(20deg);
      transition: left 0.5s ease;
    }

    .btn-back span {
      position: relative;
      z-index: 2;
    }

    .btn-back {
      isolation: isolate;
    }

    .btn-back:hover {
      background: rgba(255, 255, 255, 0.85);
      color: #634c6d;

      border-color: rgba(255, 255, 255, 0.95);

      transform: translateY(-4px);

      box-shadow:
        0 12px 28px rgba(70, 50, 78, 0.20),
        0 0 18px rgba(255, 255, 255, 0.22);
    }

    .btn-back:hover::before {
      left: 120%;
    }

    /* =========================
       Animation
    ========================= */

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       Responsive
    ========================= */

    @media (max-width: 768px) {
      body {
        padding: 30px 16px;
      }

      .nav-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .menu-card {
        padding: 35px 22px;
      }
    }

    @media (max-width: 500px) {
      .header-title {
        font-size: 1.3rem;
      }

      .menu-title {
        font-size: 1.35rem;
      }

      .nav-grid {
        grid-template-columns: 1fr;
      }

      .menu-card {
        padding: 30px 18px;
        border-radius: 25px;
      }

      .nav-btn {
        min-height: 90px;
      }

      .bubble-1 {
        width: 55px;
        height: 55px;
      }

      .bubble-3 {
        width: 75px;
        height: 75px;
      }
    }

  </style>
</head>

<body><!-- แสงเรืองด้านหลัง -->
  <div class="glow-bg-1"></div>
  <div class="glow-bg-2"></div>
  <div class="glow-bg-3"></div>

  <!-- ฟองสบู่ตกแต่ง -->
  <div class="bubble bubble-1"></div>
  <div class="bubble bubble-2"></div>
  <div class="bubble bubble-3"></div>
  <div class="bubble bubble-4"></div>
  <div class="bubble bubble-5"></div>

  <div class="container">

    <!-- แถบด้านบน -->
    <div class="top-bar">
      <div class="header-title">About Name🪻</div>
    </div>

    <!-- การ์ดรวมปุ่มกดเมนู -->
    <div class="menu-card">

      <h2 class="menu-title">
        เลือกหน้าหัวข้อที่ต้องการเข้าดู 🩻🔭
      </h2>

      <div class="nav-grid">

        <a href="intro.html" class="nav-btn">
          <span class="icon">📝</span> คำนำ
        </a>

        <a href="profile.html" class="nav-btn">
          <span class="icon">👤</span> ประวัติส่วนตัว
        </a>

        <a href="education.html" class="nav-btn">
          <span class="icon">🎓</span> ประวัติการศึกษา
        </a>

        <a href="activities.html" class="nav-btn">
          <span class="icon">👋🏻</span> กิจกรรม
        </a>

        <a href="passion.html" class="nav-btn">
          <span class="icon">💡</span> ความสนใจในการศึกษาต่อ
        </a>

        <a href="target.html" class="nav-btn">
          <span class="icon">🏛️</span> คณะ สาขาและมหาลัยที่สนใจ
        </a>

        <a href="skills.html" class="nav-btn">
          <span class="icon">🧸</span> ทักษะ
        </a>

      </div>
    </div>

    <!-- ปุ่มย้อนกลับด้านล่าง -->
    <div class="bottom-bar">
      <a href="index.html" class="btn-back">
        <span>⬅</span> back
      </a>
    </div>

  </div>

</body>
</html>
