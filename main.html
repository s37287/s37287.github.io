<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warunee Portfolio - Navigation</title>
  <!-- Google Fonts: Kanit & Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Prompt', 'Kanit', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1d0736 0%, #341254 40%, #581c87 75%, #7e22ce 100%);
      color: #ffffff;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ดวงไฟเรืองแสงด้านหลัง */
    .glow-bg-1 {
      position: fixed;
      width: 450px;
      height: 450px;
      background: rgba(168, 85, 247, 0.25);
      filter: blur(120px);
      border-radius: 50%;
      top: -50px;
      right: -50px;
      pointer-events: none;
    }

    .glow-bg-2 {
      position: fixed;
      width: 400px;
      height: 400px;
      background: rgba(126, 34, 206, 0.3);
      filter: blur(100px);
      border-radius: 50%;
      bottom: -50px;
      left: -50px;
      pointer-events: none;
    }

    .container {
      max-width: 900px;
      width: 100%;
      position: relative;
      z-index: 10;
    }

    /* แถบด้านบน: ปุ่มย้อนกลับ & หัวข้อ */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 35px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      color: #e9d5ff;
      text-decoration: none;
      font-size: 0.95rem;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .btn-back:hover {
      background: rgba(255, 255, 255, 0.25);
      color: #ffffff;
      transform: translateX(-4px);
    }

    .header-title {
      font-size: 1.4rem;
      font-weight: 700;
      background: linear-gradient(90deg, #ffffff, #d8b4fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* การ์ดรวมเมนู Glassmorphism */
    .menu-card {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 28px;
      padding: 40px 30px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .menu-title {
      font-size: 1.6rem;
      font-weight: 600;
      color: #f3e8ff;
      margin-bottom: 30px;
    }

    /* เมนูกดเลือกหน้า (Grid 3 คอลัมน์) */
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 20px 12px;
      border-radius: 20px;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .nav-btn .icon {
      font-size: 1.5rem;
    }

    .nav-btn:hover {
      background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
      border-color: #f3e8ff;
      color: #ffffff;
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 10px 25px rgba(168, 85, 247, 0.4);
    }

    @media (max-width: 768px) {
      .nav-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .nav-grid {
        grid-template-columns: 1fr;
      }
      .menu-card {
        padding: 30px 20px;
      }
      .top-bar {
        flex-direction: column;
        gap: 15px;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <!-- ไฟเรืองแสงด้านหลัง -->
  <div class="glow-bg-1"></div>
  <div class="glow-bg-2"></div>

  <div class="container">
    
    <!-- แถบด้านบน -->
    <div class="top-bar">
      <a href="index.html" class="btn-back">
        <span>⬅</span> ย้อนกลับไปหน้าปก
      </a>
      <div class="header-title">WARUNEE PORTFOLIO</div>
    </div>

    <!-- การ์ดรวมปุ่มกดเมนู -->
    <div class="menu-card">
      <h2 class="menu-title">เลือกหน้าหัวข้อที่ต้องการเข้าดู ✨</h2>

      <div class="nav-grid">
        <a href="intro.html" class="nav-btn">
          <span class="icon">📝</span> คำนำ
        </a>
        <a href="profile.html" class="nav-btn">
          <span class="icon">👤</span> ประวัติส่วนตัว
        </a>
        <a href="education.html" class="nav-btn">
          <span class="icon">🎓</span> ประวัติการศึกษา
        </a>
        <a href="skills.html" class="nav-btn">
          <span class="icon">⚡</span> ความสามารถ
        </a>
        <a href="passion.html" class="nav-btn">
          <span class="icon">💡</span> ความสนใจในการศึกษาต่อ
        </a>
        <a href="target.html" class="nav-btn">
          <span class="icon">🏛️</span> คณะ/สาขาที่สนใจ
        </a>
        <a href="volunteer.html" class="nav-btn">
          <span class="icon">🤝</span> จิตอาสา
        </a>
        <a href="problem-solving.html" class="nav-btn">
          <span class="icon">🧩</span> แก้ไขปัญหาเฉพาะหน้า
        </a>
        <a href="portfolio.html" class="nav-btn">
          <span class="icon">🏆</span> ผลงานและกิจกรรม
        </a>
      </div>
    </div>

  </div>

</body>
</html>
