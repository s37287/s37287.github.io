<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waruni Portfolio - Navigation</title>
  <!-- Google Fonts: Kanit & Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Prompt', 'Kanit', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1f1227 0%, #3e264b 40%, #684279 75%, #A378B5 100%);
      color: #ffffff;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ดวงไฟเรืองแสงด้านหลัง โทนม่วง #A378B5 และ ขาว */
    .glow-bg-1 {
      position: fixed;
      width: 450px;
      height: 450px;
      background: rgba(163, 120, 181, 0.35);
      filter: blur(120px);
      border-radius: 50%;
      top: -50px;
      right: -50px;
      pointer-events: none;
    }

    .glow-bg-2 {
      position: fixed;
      width: 400px;
      height: 400px;
      background: rgba(255, 255, 255, 0.12);
      filter: blur(100px);
      border-radius: 50%;
      bottom: -50px;
      left: -50px;
      pointer-events: none;
    }

    .container {
      max-width: 900px;
      width: 100%;
      position: relative;
      z-index: 10;
    }

    /* แถบด้านบน: หัวข้อเว็บ */
    .top-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 25px;
    }

    .header-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #ffffff 0%, #f1e7f5 50%, #A378B5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* การ์ดรวมเมนู Glassmorphism */
    .menu-card {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 28px;
      padding: 40px 30px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(31, 18, 39, 0.4);
      text-align: center;
      animation: fadeInUp 0.8s ease-out;
    }

    .menu-title {
      font-size: 1.6rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 30px;
    }

    /* เมนูกดเลือกหน้า (Grid 3 คอลัมน์) */
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 20px 12px;
      border-radius: 20px;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .nav-btn .icon {
      font-size: 1.5rem;
    }

    .nav-btn:hover {
      background: #A378B5;
      border-color: #ffffff;
      color: #ffffff;
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 10px 25px rgba(163, 120, 181, 0.5);
    }

    /* ส่วนปุ่มย้อนกลับด้านล่าง */
    .bottom-bar {
      margin-top: 35px;
      display: flex;
      justify-content: center;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 36px;
      background: #A378B5;
      border: 1.5px solid #ffffff;
      border-radius: 50px;
      color: #ffffff;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(163, 120, 181, 0.3);
    }

    .btn-back:hover {
      background: #ffffff;
      color: #533263;
      border-color: #A378B5;
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(255, 255, 255, 0.4);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .nav-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .nav-grid {
        grid-template-columns: 1fr;
      }
      .menu-card {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- ไฟเรืองแสงด้านหลัง -->
  <div class="glow-bg-1"></div>
  <div class="glow-bg-2"></div>

  <div class="container">
    
    <!-- แถบด้านบน -->
    <div class="top-bar">
      <div class="header-title">WARUNI PORTFOLIO</div>
    </div>

    <!-- การ์ดรวมปุ่มกดเมนู -->
    <div class="menu-card">
      <h2 class="menu-title">เลือกหน้าหัวข้อที่ต้องการเข้าดู ✨</h2>

      <div class="nav-grid">
        <a href="intro.html" class="nav-btn">
          <span class="icon">📝</span> คำนำ
        </a>
        <a href="profile.html" class="nav-btn">
          <span class="icon">👤</span> ประวัติส่วนตัว
        </a>
        <a href="education.html" class="nav-btn">
          <span class="icon">🎓</span> ประวัติการศึกษา
        </a>
        <a href="skills.html" class="nav-btn">
          <span class="icon">⚡</span> ความสามารถ
        </a>
        <a href="passion.html" class="nav-btn">
          <span class="icon">💡</span> ความสนใจในการศึกษาต่อ
        </a>
        <a href="target.html" class="nav-btn">
          <span class="icon">🏛️</span> คณะ/สาขาที่สนใจ
        </a>
        <a href="volunteer.html" class="nav-btn">
          <span class="icon">🤝</span> จิตอาสา
        </a>
        <a href="problem-solving.html" class="nav-btn">
          <span class="icon">🧩</span> แก้ไขปัญหาเฉพาะหน้า
        </a>
      </div>
    </div>

    <!-- ปุ่มย้อนกลับด้านล่าง -->
    <div class="bottom-bar">
      <a href="index.html" class="btn-back">
        <span>⬅</span> back
      </a>
    </div>

  </div>

</body>
</html>
