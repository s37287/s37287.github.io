<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ความสนใจ</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Kanit',sans-serif;
    background:#F6F3ED;
    text-align:center;
    padding:30px;
}

.container{
    max-width:850px;
    margin:auto;
}

h1{
    color:#7B6D8D;
    font-size:2.5rem;
    margin-bottom:25px;
}

.content{
    background:#FFFFFF;
    padding:30px;
    border-radius:20px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
    text-align:left;
    border-left:8px solid #A9B89A;
}

.content h2{
    color:#7B6D8D;
    margin-bottom:12px;
}

.content p{
    color:#555;
    line-height:1.8;
    margin-bottom:20px;
}

.btn{
    display:inline-block;
    background:#A9B89A;
    color:white;
    padding:12px 25px;
    text-decoration:none;
    border-radius:40px;
    margin-top:10px;
}

.btn:hover{
    background:#8E9E7F;
}
</style>
</head>

<body>

<div class="container">

    <h1>💗 ความสนใจ</h1>

    <div class="content">

        <!-- ✏️ ใส่เนื้อหาตรงนี้ -->

        <h2>สิ่งที่ฉันสนใจ</h2>

        <p>
           รายละเอียดเกี่ยวกับสิ่งที่สนใจ
        </p>

        <h2>งานอดิเรก</h2>

        <p>
            ใส่งานอดิเรก
        </p>

        <h2>ความสามารถที่สนใจ</h2>

        <p>
            รายละเอียดเพิ่มเติม
        </p>


        <a href="portfolio.html" class="btn">
            👈🏻 กลับหน้า Portfolio
        </a>

    </div>

</div>

</body>
</html>
