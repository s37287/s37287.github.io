<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ประวัติส่วนตัว - Waruni Portfolio</title>

  <!-- Google Fonts: Kanit & Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Prompt', 'Kanit', sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 45px 20px;
      position: relative;
      overflow-x: hidden;

      color: #ffffff;

      background:
        radial-gradient(circle at 15% 15%, rgba(211, 180, 221, 0.35), transparent 28%),
        radial-gradient(circle at 85% 20%, rgba(191, 157, 207, 0.32), transparent 27%),
        radial-gradient(circle at 80% 85%, rgba(225, 204, 231, 0.25), transparent 30%),
        linear-gradient(
          135deg,
          #66516f 0%,
          #786080 38%,
          #896d91 68%,
          #9b7fa3 100%
        );

      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ========================================
       แสงฟุ้งด้านหลัง
    ======================================== */

    .glow-bg-1,
    .glow-bg-2,
    .glow-bg-3 {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .glow-bg-1 {
      width: 430px;
      height: 430px;
      top: -150px;
      right: -100px;
      background: rgba(222, 195, 229, 0.28);
      filter: blur(75px);
    }

    .glow-bg-2 {
      width: 380px;
      height: 380px;
      bottom: -150px;
      left: -100px;
      background: rgba(214, 190, 222, 0.24);
      filter: blur(75px);
    }

    .glow-bg-3 {
      width: 250px;
      height: 250px;
      top: 45%;
      left: 50%;
      background: rgba(255, 255, 255, 0.08);
      filter: blur(70px);
    }

    /* ========================================
       ฟองกลมตกแต่ง
    ======================================== */

    .bubble {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;

      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.24);

      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);

      animation: floating 8s ease-in-out infinite;
    }

    .bubble::after {
      content: "";
      position: absolute;
      width: 25%;
      height: 25%;
      top: 16%;
      left: 18%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.32);
      filter: blur(2px);
    }

    .bubble-1 {
      width: 72px;
      height: 72px;
      top: 9%;
      left: 5%;
      animation-delay: 0s;
    }

    .bubble-2 {
      width: 35px;
      height: 35px;
      top: 28%;
      right: 7%;
      animation-delay: 1.5s;
    }

    .bubble-3 {
      width: 92px;
      height: 92px;
      bottom: 9%;
      right: 4%;
      animation-delay: 3s;
    }

    .bubble-4 {
      width: 45px;
      height: 45px;
      bottom: 22%;
      left: 7%;
      animation-delay: 2s;
    }

    .bubble-5 {
      width: 25px;
      height: 25px;
      top: 58%;
      left: 3%;
      animation-delay: 4s;
    }

    @keyframes floating {
      0%, 100% {
        transform: translateY(0) translateX(0);
      }

      50% {
        transform: translateY(-18px) translateX(7px);
      }
    }

    /* ========================================
       จุดประกายตกแต่ง
    ======================================== */

    .sparkle {
      position: fixed;
      z-index: 2;
      color: rgba(255, 255, 255, 0.55);
      font-size: 15px;
      pointer-events: none;
      animation: sparkle 3s ease-in-out infinite;
    }

    .sparkle-1 {
      top: 16%;
      right: 17%;
    }

    .sparkle-2 {
      bottom: 17%;
      left: 17%;
      font-size: 11px;
      animation-delay: 1s;
    }

    .sparkle-3 {
      top: 43%;
      right: 4%;
      font-size: 10px;
      animation-delay: 2s;
    }

    @keyframes sparkle {
      0%, 100% {
        opacity: 0.25;
        transform: scale(0.8);
      }

      50% {
        opacity: 0.8;
        transform: scale(1.2);
      }
    }

    /* ========================================
       Container
    ======================================== */

    .container {
      max-width: 850px;
      width: 100%;
      position: relative;
      z-index: 10;
    }

    /* ========================================
       Tag ด้านบน
    ======================================== */

    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 18px;
    }

    .header-tag {
      font-size: 0.85rem;
      letter-spacing: 1px;

      padding: 7px 17px;

      background: rgba(255, 255, 255, 0.13);
      border: 1px solid rgba(255, 255, 255, 0.30);

      border-radius: 30px;

      color: #ffffff;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      box-shadow:
        0 6px 18px rgba(72, 52, 80, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);

      transition: 0.3s ease;
    }

    .header-tag:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.19);
    }

    /* ========================================
       Profile Card
    ======================================== */

    .profile-card {
      position: relative;
      overflow: hidden;

      background: rgba(255, 255, 255, 0.13);

      border: 1px solid rgba(255, 255, 255, 0.30);
      border-radius: 30px;

      padding: 45px;

      backdrop-filter: blur(23px);
      -webkit-backdrop-filter: blur(23px);

      box-shadow:
        0 25px 60px rgba(67, 48, 75, 0.20),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);

      animation: fadeInUp 0.8s ease-out;
    }

    /* แสงฟุ้งด้านบนการ์ด */
    .profile-card::before {
      content: "";
      position: absolute;

      width: 280px;
      height: 110px;

      top: -65px;
      left: 50%;

      transform: translateX(-50%);

      background: rgba(255, 255, 255, 0.13);

      border-radius: 50%;
      filter: blur(35px);

      pointer-events: none;
    }

    /* ลายวงกลมมุมขวาบน */
    .profile-card::after {
      content: "✦";
      position: absolute;

      right: 25px;
      top: 18px;

      font-size: 18px;
      color: rgba(255, 255, 255, 0.28);

      pointer-events: none;
    }

    /* ========================================
       Page Title
    ======================================== */

    .page-title {
      position: relative;
      z-index: 2;

      font-size: 2.2rem;
      font-weight: 700;

      color: #ffffff;

      margin-bottom: 30px;

      display: flex;
      align-items: center;
      gap: 12px;

      border-bottom: 1px solid rgba(255, 255, 255, 0.22);
      padding-bottom: 15px;

      text-shadow:
        0 3px 12px rgba(65, 46, 72, 0.25);
    }

    .page-title span {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 48px;
      height: 48px;

      border-radius: 15px;

      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.20);

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    /* ========================================
       Profile Header
    ======================================== */

    .profile-header {
      display: flex;
      gap: 25px;
      align-items: center;

      margin-bottom: 35px;
    }

    .avatar-wrapper {
      position: relative;
      flex-shrink: 0;
    }

    .avatar-wrapper::before {
      content: "";
      position: absolute;

      width: 122px;
      height: 122px;

      left: -6px;
      top: -6px;

      border-radius: 50%;

      border: 1px dashed rgba(255, 255, 255, 0.40);

      animation: rotateRing 15s linear infinite;
    }

    .avatar-img {
      position: relative;
      z-index: 2;

      width: 110px;
      height: 110px;

      border-radius: 50%;

      object-fit: cover;

      border: 3px solid rgba(255, 255, 255, 0.65);

      box-shadow:
        0 10px 28px rgba(73, 51, 80, 0.25),
        0 0 18px rgba(214, 188, 222, 0.20);

      display: block;
    }

    @keyframes rotateRing {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .name-details h2 {
      font-size: 1.8rem;
      color: #ffffff;

      font-weight: 600;
      margin-bottom: 5px;

      text-shadow:
        0 2px 10px rgba(65, 46, 72, 0.25);
    }

    /* ========================================
       Nickname
    ======================================== */

    .nickname-badge {
      display: inline-block;

      background: rgba(174, 143, 188, 0.70);

      color: #ffffff;

      border: 1px solid rgba(255, 255, 255, 0.38);

      padding: 5px 16px;

      border-radius: 14px;

      font-size: 0.95rem;
      font-weight: 500;

      margin-bottom: 10px;

      box-shadow:
        0 5px 14px rgba(72, 51, 79, 0.12);
    }

    /* ========================================
       Info Grid
    ======================================== */

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);

      gap: 16px;

      margin-bottom: 35px;
    }

    .info-item {
      position: relative;
      overflow: hidden;

      background: rgba(255, 255, 255, 0.08);

      border: 1px solid rgba(255, 255, 255, 0.19);

      border-radius: 18px;

      padding: 16px 20px;

      display: flex;
      align-items: center;

      gap: 14px;

      transition:
        transform 0.3s ease,
        background 0.3s ease,
        box-shadow 0.3s ease,
        border-color 0.3s ease;
    }

    .info-item::before {
      content: "";

      position: absolute;

      width: 70px;
      height: 70px;

right: -30px;
      top: -30px;

      border-radius: 50%;

      background: rgba(255, 255, 255, 0.05);
    }

    .info-item:hover {
      background: rgba(255, 255, 255, 0.14);

      border-color: rgba(255, 255, 255, 0.38);

      transform: translateY(-4px);

      box-shadow:
        0 10px 25px rgba(71, 51, 79, 0.13);
    }

    .info-icon {
      position: relative;
      z-index: 2;

      font-size: 1.4rem;

      background: rgba(181, 151, 193, 0.34);

      width: 44px;
      height: 44px;

      border-radius: 13px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      border: 1px solid rgba(255, 255, 255, 0.16);

      transition: 0.3s ease;
    }

    .info-item:hover .info-icon {
      transform: rotate(-4deg) scale(1.08);
      background: rgba(190, 158, 203, 0.50);
    }

    .info-text {
      position: relative;
      z-index: 2;
    }

    .info-text .label {
      font-size: 0.82rem;

      color: #eee2f2;

      margin-bottom: 2px;
    }

    .info-text .value {
      font-size: 1rem;

      color: #ffffff;

      font-weight: 500;
    }

    /* ========================================
       Hobbies
    ======================================== */

    .section-subtitle {
      font-size: 1.2rem;

      color: #ffffff;

      margin-bottom: 15px;

      display: flex;
      align-items: center;

      gap: 8px;

      text-shadow:
        0 2px 8px rgba(65, 46, 72, 0.20);
    }

    .hobbies-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .hobby-tag {
      position: relative;
      overflow: hidden;

      background: rgba(255, 255, 255, 0.08);

      border: 1px solid rgba(255, 255, 255, 0.23);

      padding: 10px 18px;

      border-radius: 50px;

      font-size: 0.95rem;

      color: #ffffff;

      display: flex;
      align-items: center;

      gap: 8px;

      transition: all 0.3s ease;

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .hobby-tag:hover {
      background: rgba(181, 149, 194, 0.62);

      color: #ffffff;

      border-color: rgba(255, 255, 255, 0.50);

      transform: translateY(-3px) scale(1.03);

      box-shadow:
        0 8px 18px rgba(70, 49, 78, 0.14);
    }l

    /* ========================================
       Back Button
    ======================================== */

    .bottom-bar {
      margin-top: 35px;

      display: flex;
      justify-content: center;
    }

    .btn-back {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 10px;

      padding: 14px 38px;

      background: rgba(174, 143, 188, 0.72);

      border: 1.5px solid rgba(255, 255, 255, 0.65);

      border-radius: 50px;

      color: #ffffff;

      text-decoration: none;

      font-size: 1rem;
      font-weight: 600;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      transition: all 0.3s ease;

      box-shadow:
        0 9px 23px rgba(69, 49, 77, 0.17),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .btn-back:hover {
      background: rgba(255, 255, 255, 0.82);

      color: #654d6d;

      border-color: rgba(255, 255, 255, 0.90);

      transform: translateY(-4px);

      box-shadow:
        0 12px 28px rgba(70, 49, 78, 0.18);
    }

    /* ========================================
       Animation
    ======================================== */

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ========================================
       Responsive
    ======================================== */

    @media (max-width: 650px) {

      body {
        padding: 30px 15px;
      }

      .profile-header {
        flex-direction: column;
        text-align: center;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .profile-card {
        padding: 30px 20px;
        border-radius: 25px;
      }

      .page-title {
        font-size: 1.7rem;
      }

      .page-title span {
        width: 43px;
        height: 43px;
      }

      .name-details h2 {
        font-size: 1.5rem;
      }

      .top-bar {
        justify-content: center;
      }

      .bubble-1 {
        width: 55px;
        height: 55px;
      }

      .bubble-3 {
        width: 70px;
        height: 70px;
      }
    }

    @media (max-width: 400px) {

      .profile-card {
        padding: 25px 16px;
      }

      .page-title {
        font-size: 1.5rem;
      }

      .info-item {
        padding: 14px;
      }

      .hobby-tag {
        font-size: 0.88rem;
        padding: 9px 14px;
      }
    }

  </style>
</head>

<body>

  <!-- แสงฟุ้งกระจายด้านหลัง -->
  <div class="glow-bg-1"></div>
  <div class="glow-bg-2"></div>
  <div class="glow-bg-3"></div>

  <!-- ฟองกลมตกแต่ง -->
  <div class="bubble bubble-1"></div>
  <div class="bubble bubble-2"></div>
  <div class="bubble bubble-3"></div>
  <div class="bubble bubble-4"></div>
  <div class="bubble bubble-5"></div>

  <!-- ประกายเล็ก ๆ -->
  <div class="sparkle sparkle-1">✦</div>
  <div class="sparkle sparkle-2">✧</div>
  <div class="sparkle sparkle-3">✦</div>

  <div class="container">

    <!-- แถบด้านบน -->
    <div class="top-bar">
      <span class="header-tag">PERSONAL INFO</span>
    </div>

    <!-- การ์ดประวัติส่วนตัว -->
    <div class="profile-card">

      <h1 class="page-title">
        <span>👤</span> ประวัติส่วนตัว
      </h1>

      <!-- ส่วนหัวโปรไฟล์ -->
      <div class="profile-header">

        <div class="avatar-wrapper">
          <img src="profile.JPG" alt="รูปโปรไฟล์" class="avatar-img">
        </div>

        <div class="name-details">
          <span class="nickname-badge">ชื่อเล่น : เนม</span>
          <h2>นางสาววารุณี ลิภูนนท์</h2>
        </div>

      </div>

      <!-- ข้อมูลพื้นฐาน 2 คอลัมน์ -->
      <div class="info-grid">

        <div class="info-item">
          <div class="info-icon">🎂</div>
          <div class="info-text">
            <div class="label">วัน/เดือน/ปีเกิด</div>
            <div class="value">3 ตุลาคม 2551</div>
          </div>
        </div>

        <div class="info-item">
          <div class="info-icon">🩸</div>
          <div class="info-text">
            <div class="label">หมู่เลือด</div>
            <div class="value">-</div>
          </div>
        </div>

        <div class="info-item">
          <div class="info-icon">🇹🇭</div>
          <div class="info-text">
            <div class="label">เชื้อชาติ / สัญชาติ</div>
            <div class="value">ไทย / ไทย</div>
          </div>
        </div>

        <div class="info-item">
          <div class="info-icon">🙏</div>
          <div class="info-text">
            <div class="label">ศาสนา</div>
            <div class="value">พุทธ</div>
          </div>
        </div>

      </div>

      <!-- ส่วนงานอดิเรก -->
      <h3 class="section-subtitle">
        <span>🎨</span> งานอดิเรก (Hobbies)
      </h3>

      <div class="hobbies-wrapper">

        <div class="hobby-tag">🎧 ฟังเพลง</div>
        <div class="hobby-tag">📖 อ่านนิยาย</div>
        <div class="hobby-tag">🌸 ค้นดูดอกไม้สวยงาม</div>
        <div class="hobby-tag">🍄 ดูคนหาเก็บเห็ด</div>
        <div class="hobby-tag">🌱 ดูการปลูกต้นไม้ต่าง ๆ</div>

      </div>

    </div>

    <!-- ปุ่มย้อนกลับด้านล่างสุด -->
    <div class="bottom-bar">
      <a href="main.html" class="btn-back">
        <span>⬅</span> back
      </a>
    </div>

  </div>

</body>
</html>
