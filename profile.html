<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ประวัติส่วนตัว - Warunee Portfolio</title>
  <!-- Google Fonts: Kanit & Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Prompt', 'Kanit', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1f1227 0%, #3e264b 40%, #684279 75%, #A378B5 100%);
      color: #ffffff;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ดวงไฟเรืองแสงด้านหลัง โทนม่วง #A378B5 และ ขาว */
    .glow-bg-1 {
      position: fixed;
      width: 450px;
      height: 450px;
      background: rgba(163, 120, 181, 0.35);
      filter: blur(120px);
      border-radius: 50%;
      top: -50px;
      right: -50px;
      pointer-events: none;
    }

    .glow-bg-2 {
      position: fixed;
      width: 400px;
      height: 400px;
      background: rgba(255, 255, 255, 0.12);
      filter: blur(100px);
      border-radius: 50%;
      bottom: -50px;
      left: -50px;
      pointer-events: none;
    }

    .container {
      max-width: 850px;
      width: 100%;
      position: relative;
      z-index: 10;
    }

    /* แถบด้านบนแสดง Tag */
    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    .header-tag {
      font-size: 0.9rem;
      padding: 6px 16px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      color: #ffffff;
    }

    /* การ์ดกระจกฝ้า Glassmorphism */
    .profile-card {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 28px;
      padding: 45px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(31, 18, 39, 0.4);
      animation: fadeInUp 0.8s ease-out;
    }

    .page-title {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(90deg, #ffffff 0%, #f1e7f5 50%, #A378B5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 15px;
    }

    /* เลย์เอาต์ส่วนบน: รูป + ข้อมูลหลัก */
    .profile-header {
      display: flex;
      gap: 25px;
      align-items: center;
      margin-bottom: 35px;
    }

    .avatar-wrapper {
      position: relative;
      flex-shrink: 0;
    }

    /* ปรับขนาดและสไตล์ของรูปโปรไฟล์ */
    .avatar-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 10px 25px rgba(163, 120, 181, 0.4);
      display: block;
    }

    .name-details h2 {
      font-size: 1.8rem;
      color: #ffffff;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .nickname-badge {
      display: inline-block;
      background: #A378B5;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 4px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 10px;
    }

    /* ตาราง Grid ข้อมูลส่วนตัว */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 35px;
    }

    .info-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.3s ease;
    }

    .info-item:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
    }

    .info-icon {
      font-size: 1.4rem;
      background: rgba(163, 120, 181, 0.3);
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .info-text .label {
      font-size: 0.82rem;
      color: #f1e7f5;
      margin-bottom: 2px;
    }

    .info-text .value {
      font-size: 1rem;
      color: #ffffff;
      font-weight: 500;
    }

    /* โซนงานอดิเรก */
    .section-subtitle {
      font-size: 1.2rem;
      color: #ffffff;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hobbies-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .hobby-tag {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 10px 18px;
      border-radius: 50px;
      font-size: 0.95rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .hobby-tag:hover {
      background: #A378B5;
      color: #ffffff;
      border-color: #ffffff;
      transform: scale(1.05);
    }

    /* โซนปุ่มย้อนกลับด้านล่างสุด */
    .bottom-bar {
      margin-top: 35px;
      display: flex;
      justify-content: center;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 36px;
      background: #A378B5;
      border: 1.5px solid #ffffff;
      border-radius: 50px;
      color: #ffffff;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(163, 120, 181, 0.3);
    }

    .btn-back:hover {
      background: #ffffff;
      color: #533263;
      border-color: #A378B5;
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(255, 255, 255, 0.4);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 650px) {
      .profile-header {
        flex-direction: column;
        text-align: center;
      }
      .info-grid {
        grid-template-columns: 1fr;
      }
      .profile-card {
        padding: 30px 20px;
      }
      .page-title {
        font-size: 1.7rem;
      }
    }
  </style>
</head>
<body>

  <!-- แสงฟุ้งกระจายด้านหลัง -->
  <div class="glow-bg-1"></div>
  <div class="glow-bg-2"></div>

  <div class="container">
    
    <!-- แถบด้านบน -->
    <div class="top-bar">
      <span class="header-tag">PERSONAL INFO</span>
    </div>

    <!-- การ์ดประวัติส่วนตัว -->
    <div class="profile-card">

      <h1 class="page-title">
        <span>👤</span> ประวัติส่วนตัว
      </h1>

      <!-- ส่วนหัวโปรไฟล์ -->
      <div class="profile-header">
        <div class="avatar-wrapper">
          <img src="profile.JPG" alt="รูปโปรไฟล์" class="avatar-img">
        </div>

        <div class="name-details">
          <span class="nickname-badge">ชื่อเล่น : เนม</span>
          <h2>นางสาววารุณี ลิภูนนท์</h2>
        </div>
      </div>

      <!-- ข้อมูลพื้นฐาน 2 คอลัมน์ -->
      <div class="info-grid">
        <div class="info-item">
          <div class="info-icon">🎂</div>
          <div class="info-text">
            <div class="label">วัน/เดือน/ปีเกิด</div>
            <div class="value">3 ตุลาคม 2551</div>
          </div>
        </div>

        <div class="info-item">
          <div class="info-icon">🩸</div>
          <div class="info-text">
            <div class="label">หมู่เลือด</div>
            <div class="value">-</div>
          </div>
        </div>

        <div class="info-item">
          <div class="info-icon">🇹🇭</div>
          <div class="info-text">
            <div class="label">เชื้อชาติ / สัญชาติ</div>
            <div class="value">ไทย / ไทย</div>
          </div>
        </div>

        <div class="info-item">
          <div class="info-icon">🙏</div>
          <div class="info-text">
            <div class="label">ศาสนา</div>
            <div class="value">พุทธ</div>
          </div>
        </div>
      </div>

      <!-- ส่วนงานอดิเรก -->
      <h3 class="section-subtitle">
        <span>🎨</span> งานอดิเรก (Hobbies)
      </h3>
      <div class="hobbies-wrapper">
        <div class="hobby-tag">🎧 ฟังเพลง</div>
        <div class="hobby-tag">📖 อ่านนิยาย</div>
        <div class="hobby-tag">🌸 ค้นดูดอกไม้สวยงาม</div>
        <div class="hobby-tag">🍄 ดูคนหาเก็บเห็ด</div>
        <div class="hobby-tag">🌱 ดูการปลูกต้นไม้ต่าง ๆ</div>
      </div>

    </div>

    <!-- ปุ่มย้อนกลับด้านล่างสุด -->
    <div class="bottom-bar">
      <a href="main.html" class="btn-back">
        <span>⬅</span> back
      </a>
    </div>

  </div>

</body>
</html>
