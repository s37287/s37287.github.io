<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Waruni's Profile</title>
  <!-- Google Fonts: Prompt & Kanit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Prompt', 'Kanit', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1f1227 0%, #3e264b 40%, #684279 75%, #A378B5 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      overflow-x: hidden;
      position: relative;
    }

    /* ตกแต่งวงกลมสว่างเรืองแสงด้านหลัง */
    .glow-circle-1 {
      position: absolute;
      width: 380px;
      height: 380px;
      background: rgba(163, 120, 181, 0.4);
      filter: blur(100px);
      border-radius: 50%;
      top: 10%;
      left: 10%;
      z-index: 1;
    }

    .glow-circle-2 {
      position: absolute;
      width: 420px;
      height: 420px;
      background: rgba(255, 255, 255, 0.15);
      filter: blur(110px);
      border-radius: 50%;
      bottom: 10%;
      right: 10%;
      z-index: 1;
    }

    /* การ์ดหน้าปก Glassmorphism */
    .profile-card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 28px;
      padding: 50px 40px;
      max-width: 650px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(31, 18, 39, 0.5);
      animation: fadeIn 1.2s ease-out;
    }

    .welcome-title {
      font-size: 1.8rem;
      font-weight: 400;
      color: #ffffff;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
      opacity: 0.95;
    }

    .name-heading {
      font-size: 2.8rem;
      font-weight: 700;
      background: linear-gradient(90deg, #ffffff 0%, #f1e7f5 50%, #A378B5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
      text-shadow: 0 5px 20px rgba(163, 120, 181, 0.3);
    }

    .study-box {
      background: rgba(255, 255, 255, 0.08);
      border-left: 4px solid #A378B5;
      border-radius: 12px;
      padding: 16px 20px;
      margin: 20px 0 25px;
      text-align: left;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .study-box p {
      font-size: 0.95rem;
      color: #f1e7f5;
      margin-bottom: 5px;
    }

    .study-box h4 {
      font-size: 1.15rem;
      color: #ffffff;
      font-weight: 600;
      line-height: 1.5;
    }

    .github-note {
      font-size: 0.95rem;
      color: #ffffff;
      margin-bottom: 35px;
      opacity: 0.85;
    }

    /* ปุ่มกดถัดไป */
    .btn-next {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 42px;
      background: #A378B5;
      color: #ffffff;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 50px;
      box-shadow: 0 10px 25px rgba(163, 120, 181, 0.4);
      transition: all 0.3s ease;
      border: 1.5px solid #ffffff;
    }

    .btn-next:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 15px 35px rgba(255, 255, 255, 0.4);
      background: #ffffff;
      color: #533263;
      border-color: #A378B5;
    }

    .btn-next span {
      transition: transform 0.3s ease;
    }

    .btn-next:hover span {
      transform: translateX(5px);
    }

    /* Animation */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .profile-card {
        padding: 35px 25px;
      }
      .name-heading {
        font-size: 2.1rem;
      }
      .welcome-title {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>

  <!-- แสงฟุ้งกระจายด้านหลัง -->
  <div class="glow-circle-1"></div>
  <div class="glow-circle-2"></div>

  <!-- การ์ดหน้าปกหลัก -->
  <div class="profile-card">
    <h2 class="welcome-title">Welcome to my profile ka!! ✨</h2>
    <h1 class="name-heading">วารุณี ลิภูนนท์</h1>

    <div class="study-box">
      <p>กำลังศึกษาและสนใจด้าน:</p>
      <h4>Gifted & Bachelor of Science in Radiological Technology ⚛️🩺</h4>
    </div>

    <p class="github-note">
      นี่คือเว็บไซต์แรกของฉันที่โฮสต์บน GitHub Pages 🔮💕
    </p>

    <!-- ปุ่มเชื่อมต่อไปยังหน้าเนื้อหาหลัก -->
    <a href="main.html" class="btn-next">
      <span>go to next page➔</span>
    </a>
  </div>

</body>
</html>
