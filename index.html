<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Waruni's Profile</title>
  <!-- Google Fonts: Prompt & Kanit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Prompt', 'Kanit', sans-serif;
  }

  /* =========================
     พื้นหลังหลัก
  ========================= */

  body {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    color: #ffffff;

    overflow: hidden;
    position: relative;

    /* จากม่วงเข้ม → ม่วงลาเวนเดอร์ที่สว่างขึ้น */
    background:
      radial-gradient(
        circle at 15% 15%,
        rgba(255, 255, 255, 0.45),
        transparent 25%
      ),
      radial-gradient(
        circle at 85% 85%,
        rgba(235, 210, 255, 0.45),
        transparent 30%
      ),
      linear-gradient(
        135deg,
        #d9c7e8 0%,
        #c1a3d9 30%,
        #a47bc0 65%,
        #8c62a5 100%
      );
  }


  /* =========================
     แสงฟุ้งด้านหลัง
  ========================= */

  .glow-circle-1 {
    position: absolute;

    width: 430px;
    height: 430px;

    top: -120px;
    left: -100px;

    background: rgba(255, 255, 255, 0.35);

    filter: blur(80px);

    border-radius: 50%;

    z-index: 1;

    animation: floatGlow 7s ease-in-out infinite;
  }


  .glow-circle-2 {
    position: absolute;

    width: 480px;
    height: 480px;

    bottom: -170px;
    right: -120px;

    background: rgba(240, 218, 255, 0.45);

    filter: blur(90px);

    border-radius: 50%;

    z-index: 1;

    animation: floatGlow 9s ease-in-out infinite reverse;
  }


  /* =========================
     วงกลมตกแต่ง
  ========================= */

  body::before,
  body::after {
    content: "";
    position: absolute;

    border-radius: 50%;

    background: rgba(255, 255, 255, 0.12);

    border: 1px solid rgba(255, 255, 255, 0.25);

    backdrop-filter: blur(5px);

    z-index: 2;
  }

  body::before {
    width: 75px;
    height: 75px;

    top: 12%;
    right: 13%;

    animation: bubbleFloat 6s ease-in-out infinite;
  }

  body::after {
    width: 38px;
    height: 38px;

    bottom: 18%;
    left: 15%;

    animation: bubbleFloat 5s ease-in-out infinite reverse;
  }


  /* =========================
     Profile Card
  ========================= */

  .profile-card {
    position: relative;

    z-index: 10;

    width: 90%;
    max-width: 680px;

    padding: 55px 55px 50px;

    text-align: center;

    /* Glassmorphism ที่สว่างขึ้น */
    background: rgba(255, 255, 255, 0.22);

    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);

    border: 1px solid rgba(255, 255, 255, 0.55);

    border-radius: 35px;

    box-shadow:
      0 25px 70px rgba(75, 40, 95, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.45);

    animation: fadeIn 1s cubic-bezier(.2, .8, .2, 1);
  }


  /* เส้นแสงด้านบน Card */

  .profile-card::before {
    content: "";

    position: absolute;

    top: 0;
    left: 12%;

    width: 76%;
    height: 2px;

    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 255, 255, 0.9),
      transparent
    );

    border-radius: 50%;
  }


  /* =========================
     Welcome
  ========================= */

  .welcome-title {
    font-size: 1.65rem;

    font-weight: 400;

    color: #ffffff;

    margin-bottom: 8px;

    letter-spacing: 0.5px;

    text-shadow:
      0 3px 15px rgba(90, 45, 110, 0.25);

    animation: textFade 1s ease;
  }


  /* =========================
     ชื่อ
  ========================= */

  .name-heading {
    font-size: clamp(2.2rem, 6vw, 3rem);

    font-weight: 700;

    margin-bottom: 25px;

    background: linear-gradient(
      90deg,
      #ffffff 0%,
      #fff8ff 45%,
      #f1dcff 75%,
      #e0baff 100%
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    filter:
      drop-shadow(
        0 5px 15px rgba(95, 50, 120, 0.25)
      );
  }


  /* =========================
     กล่องสาขาที่เรียน
  ========================= */

  .study-box {
    position: relative;

    padding: 20px 25px;

    margin: 25px 0 25px;

    text-align: left;

    background: rgba(255, 255, 255, 0.16);

    border: 1px solid rgba(255, 255, 255, 0.30);

    border-left: 5px solid #f2d9ff;

    border-radius: 18px;

    box-shadow:
      0 8px 25px rgba(80, 42, 100, 0.10),
      inset 0 1px 0 rgba(255, 255, 255, 0.20);

    transition:
      transform 0.3s ease,
      background 0.3s ease,
      box-shadow 0.3s ease;
  }


  .study-box:hover {
    transform: translateY(-3px);

    background: rgba(255, 255, 255, 0.23);

    box-shadow:
      0 12px 30px rgba(80, 42, 100, 0.16);
  }


  .study-box p {
    font-size: 0.95rem;

    color: #fff8ff;

    margin-bottom: 6px;
  }


  .study-box h4 {
    font-size: 1.1rem;

    color: #ffffff;

    font-weight: 600;

    line-height: 1.6;
  }


  /* =========================
     GitHub Note
  ========================= */

  .github-note {
    font-size: 0.95rem;

    line-height: 1.7;

    color: #ffffff;

    margin-bottom: 32px;

    opacity: 0.95;
  }


  /* =========================
     ปุ่ม
  ========================= */

  .btn-next {
    position: relative;

    overflow: hidden;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 10px;

    padding: 15px 40px;

    background:
      linear-gradient(
        135deg,
        #c99ae3,
        #a978c3
      );

    color: #ffffff;

    text-decoration: none;

    font-size: 1.05rem;

    font-weight: 600;

    border-radius: 50px;

    border: 1.5px solid rgba(255, 255, 255, 0.9);

    box-shadow:
      0 10px 25px rgba(91, 49, 116, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.35);

    transition:
      transform 0.3s ease,
      box-shadow 0.3s ease,
      background 0.3s ease,
      color 0.3s ease;
  }


  /* แสงวิ่งผ่านปุ่ม */

  .btn-next::before {
    content: "";

    position: absolute;

    top: 0;
    left: -100%;

    width: 70%;
    height: 100%;

    background:
      linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.40),
        transparent
      );

    transform: skewX(-20deg);

    transition: left 0.6s ease;
  }


  .btn-next:hover::before {
    left: 130%;
  }


  .btn-next:hover {
    transform:
      translateY(-4px)
      scale(1.03);

    background:
      linear-gradient(
        135deg,
        #ffffff,
        #f4e6ff
      );

    color: #704887;

    box-shadow:
      0 15px 35px rgba(90, 45, 115, 0.30);
  }


  .btn-next span {
    position: relative;

    z-index: 2;

    transition:
      transform 0.3s ease;
  }


  .btn-next:hover span {
    transform: translateX(5px);
  }


  /* =========================
     Animation
  ========================= */

  @keyframes fadeIn {

    from {
      opacity: 0;

      transform:
        translateY(35px)
        scale(0.96);
    }

    to {
      opacity: 1;

      transform:
        translateY(0)
        scale(1);
    }
  }


  @keyframes textFade {

    from {
      opacity: 0;

      transform:
        translateY(10px);
    }

    to {
      opacity: 1;

      transform:
        translateY(0);
    }
  }


  @keyframes floatGlow {

    0%, 100% {
      transform:
        translate(0, 0);
    }

    50% {
      transform:
        translate(20px, 15px);
    }
  }


  @keyframes bubbleFloat {

    0%, 100% {
      transform:
        translateY(0);
    }

    50% {
      transform:
        translateY(-15px);
    }
  }


  /* =========================
     Mobile
  ========================= */

  @media (max-width: 600px) {

    body {
      padding: 25px 0;

      overflow-y: auto;
    }

    .profile-card {
      width: 90%;

      padding: 40px 25px;

      border-radius: 28px;
    }

    .welcome-title {
      font-size: 1.3rem;
    }

    .name-heading {
      font-size: 2.1rem;

      line-height: 1.3;
    }

    .study-box {
      padding: 17px 18px;
    }

    .study-box h4 {
      font-size: 1rem;
    }

    .github-note {
      font-size: 0.9rem;
    }

    .btn-next {
      width: 100%;

      padding: 15px 25px;
    }
  }
</style>
</head>
<body>

  <!-- แสงฟุ้งกระจายด้านหลัง -->
  <div class="glow-circle-1"></div>
  <div class="glow-circle-2"></div>

  <!-- การ์ดหน้าปกหลัก -->
  <div class="profile-card">
    <h2 class="welcome-title">Welcome to my profile ka!! ✨</h2>
    <h1 class="name-heading">ดิฉัน วารุณี ลิภูนนท์</h1>

    <div class="study-box">
      <p>กำลังศึกษาและสนใจด้าน:</p>
      <h4>Gifted & Bachelor of Science in Radiological Technology ⚛️🩺</h4>
    </div>

    <p class="github-note">
      นี่คือเว็บไซต์แรกของฉันที่โฮสต์บน GitHub Pages 🔮💕
    </p>

    <!-- ปุ่มเชื่อมต่อไปยังหน้าเนื้อหาหลัก -->
    <a href="main.html" class="btn-next">
      <span>go to next page➔</span>
    </a>
  </div>

</body>
</html>
