<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หน้าแนะนำตัวของฉัน</title>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Prompt', sans-serif;
    background: linear-gradient(135deg,#b1bca0,#d8d1c4);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    background:#ffffff;
    max-width:600px;
    width:100%;
    padding:45px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.12);
    transition:0.3s ease;
}

.card:hover{
    transform:translateY(-5px);
}

h1{
    color:#635467;
    margin-bottom:20px;
    font-size:2rem;
}

.name{
    font-size:1.3rem;
    font-weight:600;
    color:#635467;
    margin-bottom:15px;
}

p{
    color:#555;
    line-height:1.8;
    font-size:1rem;
}

.tag{
    display:inline-block;
    margin-top:15px;
    padding:10px 18px;
    background:#ece8e1;
    color:#635467;
    border-radius:20px;
    font-size:0.95rem;
}

.btn{
    display:inline-block;
    margin-top:30px;
    padding:12px 28px;
    background:#635467;
    color:white;
    text-decoration:none;
    border-radius:30px;
    transition:0.3s;
}

.btn:hover{
    background:#504255;
}

.footer{
    margin-top:25px;
    color:#888;
    font-size:0.9rem;
}
</style>
</head>

<body>

<div class="card">
    <h1>👋🏻 ยินดีต้อนรับสู่โปรไฟล์ของฉัน</h1>

    <div class="name">
        วารุณี ลิภูนนท์
    </div>

    <p>
        กำลังศึกษาและสนใจด้าน
    </p>

    <div class="tag">
        Gifted & Bachelor of Science in Radiological Technology
    </div>

    <p style="margin-top:20px;">
        ✨ นี่คือเว็บไซต์แรกของฉันที่โฮสต์บน GitHub Pages
    </p>

    <a href="portfolio.html" class="btn">
        📁 ดูแฟ้มสะสมงาน
    </a>

    <div class="footer">
        Thank you for visiting my website 💜
    </div>
</div>

</body>
</html>
