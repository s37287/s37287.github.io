<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คณะและสาขาที่สนใจ - Waruni Portfolio</title>
  <!-- Google Fonts: Kanit & Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Prompt', 'Kanit', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1f1227 0%, #3e264b 40%, #684279 75%, #A378B5 100%);
      color: #ffffff;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ดวงไฟเรืองแสงด้านหลัง โทนม่วง #A378B5 และ ขาว */
    .glow-bg-1 {
      position: fixed;
      width: 450px;
      height: 450px;
      background: rgba(163, 120, 181, 0.35);
      filter: blur(120px);
      border-radius: 50%;
      top: -50px;
      right: -50px;
      pointer-events: none;
    }

    .glow-bg-2 {
      position: fixed;
      width: 400px;
      height: 400px;
      background: rgba(255, 255, 255, 0.12);
      filter: blur(100px);
      border-radius: 50%;
      bottom: -50px;
      left: -50px;
      pointer-events: none;
    }

    .container {
      max-width: 850px;
      width: 100%;
      position: relative;
      z-index: 10;
    }

    /* แถบด้านบนแสดง Tag */
    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    .header-tag {
      font-size: 0.9rem;
      padding: 6px 16px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      color: #ffffff;
    }

    /* การ์ดกระจกฝ้า Glassmorphism */
    .content-card {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 28px;
      padding: 50px 45px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(31, 18, 39, 0.4);
      animation: fadeInUp 0.8s ease-out;
    }
    /* รูปภาพด้านบน */
    .profile-image {
      display: flex;
      justify-content: center;
      margin-bottom: 25px;
    }

    .profile-image img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 50%;
    }

    .page-title {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(90deg, #ffffff 0%, #f1e7f5 50%, #A378B5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 15px;
    }

    /* โซนเน้นข้อความข้อมูลสำคัญ */
    .info-box {
      background: rgba(255, 255, 255, 0.08);
      border-left: 4px solid #A378B5;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      border-right: 1px solid rgba(255, 255, 255, 0.15);
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 25px 30px;
      margin-bottom: 20px;
    }

    .info-label {
      font-size: 0.95rem;
      color: #f1e7f5;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .info-value {
      font-size: 1.4rem;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.5;
    }

    /* โซนปุ่มย้อนกลับด้านล่างสุด */
    .bottom-bar {
      margin-top: 35px;
      display: flex;
      justify-content: center;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 36px;
      background: #A378B5;
      border: 1.5px solid #ffffff;
      border-radius: 50px;
      color: #ffffff;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(163, 120, 181, 0.3);
    }

    .btn-back:hover {
      background: #ffffff;
      color: #533263;
      border-color: #A378B5;
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(255, 255, 255, 0.4);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .content-card {
        padding: 35px 20px;
      }
      .page-title {
        font-size: 1.5rem;
      }
      .info-value {
        font-size: 1.15rem;
      }
    }
  </style>
</head>
<body>

  <!-- แสงฟุ้งกระจายด้านหลัง -->
  <div class="glow-bg-1"></div>
  <div class="glow-bg-2"></div>

  <div class="container">
    
    <!-- แถบด้านบน -->
    <div class="top-bar">
      <span class="header-tag">TARGET FACULTY</span>
    </div>

    <!-- การ์ดเนื้อหา -->
    <div class="content-card">

      <!-- รูปด้านบน -->
      <div class="profile-image">
        <img src="IMG_0687.png" alt="รูปภาพ">
      </div>

      <h1 class="page-title">
        <span>🏥</span> คณะและสาขาที่สนใจศึกษาต่อ
      </h1>

      <!-- กล่องข้อมูลคณะ -->
      <div class="info-box">
        <div class="info-label">คณะที่สนใจศึกษาต่อ</div>
        <div class="info-value">คณะเทคนิคการแพทย์</div>
      </div>

      <!-- กล่องข้อมูลหลักสูตรและสาขา -->
      <div class="info-box">
        <div class="info-label">หลักสูตร / สาขาวิชา</div>
        <div class="info-value">หลักสูตรวิทยาศาสตรบัณฑิต สาขาวิชารังสีเทคนิค (ภาษาไทย ปกติ) ⚛️🩺</div>
      </div>

    </div>

    <!-- ปุ่มย้อนกลับด้านล่างสุด -->
    <div class="bottom-bar">
      <a href="main.html" class="btn-back">
        <span>⬅</span> ย้อนกลับหน้าเมนูหลัก
      </a>
    </div>

  </div>

</body>
</html>
